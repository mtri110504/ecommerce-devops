name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ecr.yml"

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    name: Staging Validation
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create cloudtech-staging

      - name: Start MySQL
        run: |
          docker run -d \
            --name cloudtech-mysql \
            --network cloudtech-staging \
            -e MYSQL_ROOT_PASSWORD=staging123 \
            -e MYSQL_DATABASE=ecommerce_db \
            mysql:8.0

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker exec cloudtech-mysql \
              mysqladmin ping -h localhost -uroot -pstaging123 --silent; then
              echo "MySQL is ready."
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 5
          done

          echo "MySQL failed to start."
          exit 1

      - name: Initialize database
        run: |
          docker exec -i cloudtech-mysql \
            mysql -uroot -pstaging123 ecommerce_db \
            < database/init.sql

      - name: Build backend image
        run: docker build -t cloudtech-backend:staging ./backend

      - name: Start backend
        run: |
          docker run -d \
            --name cloudtech-backend \
            --network cloudtech-staging \
            -p 5001:5001 \
            -e PORT=5001 \
            -e DB_HOST=cloudtech-mysql \
            -e DB_USER=root \
            -e DB_PASSWORD=staging123 \
            -e DB_NAME=ecommerce_db \
            -e JWT_SECRET=staging-test-secret \
            cloudtech-backend:staging

      - name: Backend smoke test
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:5001/api/products

      - name: Build frontend image
        run: docker build -t cloudtech-frontend:staging ./frontend

      - name: Start frontend
        run: |
          docker run -d \
            --name cloudtech-frontend \
            -p 8080:80 \
            cloudtech-frontend:staging

      - name: Frontend smoke test
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8080/

  push-images:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: staging
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/cloudtech-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/cloudtech-backend:latest \
            ./backend

          docker push $ECR_REGISTRY/cloudtech-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloudtech-backend:latest

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/cloudtech-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/cloudtech-frontend:latest \
            ./frontend

          docker push $ECR_REGISTRY/cloudtech-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloudtech-frontend:latest

      - name: Start Auto Scaling instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name cloudtech-app-asg \
            --strategy Rolling \
            --preferences MinHealthyPercentage=0,InstanceWarmup=180 \
            --region ${{ vars.AWS_REGION }} \
            --query 'InstanceRefreshId' \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"

          for i in {1..40}; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name cloudtech-app-asg \
              --instance-refresh-ids "$REFRESH_ID" \
              --region ${{ vars.AWS_REGION }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Instance Refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Deployment completed successfully."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "RollbackFailed" ]; then
              echo "Deployment failed: $STATUS"
              exit 1
            fi

            sleep 15
          done

          echo "Deployment timed out."
          exit 1

      - name: Production smoke test
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            http://cloudtech-alb-276288998.ap-southeast-1.elb.amazonaws.com/api/products
