name: Build and Push to ECR

on:
  push:
    branches:
      - main
     paths:
       - "backend/**"
       - "frontend/**"
       - ".github/workflows/ecr.yml"

permissions:
  contents: read
  id-token: write

jobs:
  push-images:
    name: Push Docker Images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
          -t $ECR_REGISTRY/cloudtech-backend:$IMAGE_TAG \
          -t $ECR_REGISTRY/cloudtech-backend:latest \
          ./backend

          docker push $ECR_REGISTRY/cloudtech-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloudtech-backend:latest

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
          -t $ECR_REGISTRY/cloudtech-frontend:$IMAGE_TAG \
          -t $ECR_REGISTRY/cloudtech-frontend:latest \
          ./frontend

          docker push $ECR_REGISTRY/cloudtech-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloudtech-frontend:latest

      - name: Start Auto Scaling instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name cloudtech-app-asg \
            --strategy Rolling \
            --preferences MinHealthyPercentage=0,InstanceWarmup=180 \
            --region ${{ vars.AWS_REGION }} \
            --query 'InstanceRefreshId' \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"

          for i in {1..40}; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name cloudtech-app-asg \
              --instance-refresh-ids "$REFRESH_ID" \
              --region ${{ vars.AWS_REGION }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Instance Refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Deployment completed successfully."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "RollbackFailed" ]; then
              echo "Deployment failed: $STATUS"
              exit 1
            fi

            sleep 15
          done

          echo "Deployment timed out."
          exit 1

      - name: Smoke test
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            http://cloudtech-alb-276288998.ap-southeast-1.elb.amazonaws.com/api/products
