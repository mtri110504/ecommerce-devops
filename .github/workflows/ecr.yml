name: Build and Push to ECR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  push-images:
    name: Push Docker Images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
          -t $ECR_REGISTRY/cloudtech-backend:$IMAGE_TAG \
          -t $ECR_REGISTRY/cloudtech-backend:latest \
          ./backend

          docker push $ECR_REGISTRY/cloudtech-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloudtech-backend:latest

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
          -t $ECR_REGISTRY/cloudtech-frontend:$IMAGE_TAG \
          -t $ECR_REGISTRY/cloudtech-frontend:latest \
          ./frontend

          docker push $ECR_REGISTRY/cloudtech-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloudtech-frontend:latest
